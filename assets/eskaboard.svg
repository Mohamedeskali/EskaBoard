<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>EskaBoard</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8ff7"/>
      <stop offset="1" stop-color="#2154c4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#253043"/>
      <stop offset="1" stop-color="#141b27"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0b1a3a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background tile -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>

  <!-- PC monitor -->
  <g filter="url(#shadow)">
    <path d="M150 158 h32 l7 20 h-46 z" fill="#c9d3e3"/>
    <rect x="128" y="174" width="76" height="9" rx="4.5" fill="#e8edf5"/>
    <rect x="88" y="42" width="148" height="118" rx="12" fill="#e8edf5"/>
    <rect x="96" y="50" width="132" height="100" rx="6" fill="url(#screen)"/>
  </g>
  <!-- typed text (right-to-left) + cursor on the PC -->
  <rect x="118" y="66" width="96" height="8" rx="4" fill="#7fb2ff"/>
  <rect x="142" y="84" width="72" height="8" rx="4" fill="#7fb2ff"/>
  <rect x="170" y="102" width="44" height="8" rx="4" fill="#7fb2ff"/>
  <rect x="160" y="98" width="5" height="16" rx="1.5" fill="#ffc53d"/>

  <!-- signal from phone to PC -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M36 58 A 18 18 0 0 1 54 76" opacity="0.95"/>
    <path d="M36 44 A 32 32 0 0 1 68 76" opacity="0.7"/>
    <path d="M36 30 A 46 46 0 0 1 82 76" opacity="0.45"/>
  </g>

  <!-- phone -->
  <g filter="url(#shadow)">
    <rect x="24" y="84" width="88" height="152" rx="17" fill="#141b27"/>
    <rect x="30" y="92" width="76" height="136" rx="11" fill="#f5f8fc"/>
  </g>
  <rect x="58" y="87" width="20" height="3" rx="1.5" fill="#3a4556"/>
  <!-- text field on the phone -->
  <rect x="37" y="102" width="62" height="30" rx="6" fill="#dde5f0"/>
  <rect x="43" y="110" width="36" height="5" rx="2.5" fill="#6b7a90"/>
  <rect x="43" y="119" width="22" height="5" rx="2.5" fill="#6b7a90"/>
  <!-- keyboard -->
  <g fill="#c6d1e0">
    <rect x="37" y="146" width="13" height="13" rx="3"/>
    <rect x="53.3" y="146" width="13" height="13" rx="3"/>
    <rect x="69.6" y="146" width="13" height="13" rx="3"/>
    <rect x="86" y="146" width="13" height="13" rx="3"/>
    <rect x="37" y="163" width="13" height="13" rx="3"/>
    <rect x="69.6" y="163" width="13" height="13" rx="3"/>
    <rect x="86" y="163" width="13" height="13" rx="3"/>
    <rect x="37" y="180" width="13" height="13" rx="3"/>
    <rect x="53.3" y="180" width="13" height="13" rx="3"/>
    <rect x="69.6" y="180" width="13" height="13" rx="3"/>
    <rect x="86" y="180" width="13" height="13" rx="3"/>
    <rect x="37" y="197" width="62" height="13" rx="3"/>
  </g>
  <!-- key being pressed -->
  <rect x="53.3" y="163" width="13" height="13" rx="3" fill="#2f6de0"/>
</svg>
