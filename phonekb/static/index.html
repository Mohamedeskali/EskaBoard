<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
    <title>EskaBoard</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root {
            --bg: #0e1116;
            --surface: #161a21;
            --raised: #1f242d;
            --raised-down: #2b313c;
            --border: #2a303a;
            --fg: #e9ecf2;
            --muted: #8d96a7;
            --accent: #4f8ff7;
            --accent-down: #2f6de0;
            --accent-soft: rgba(79, 143, 247, 0.16);
            --on-accent: #fff;
            --ok: #34c77b;
            --bad: #f0524f;
            --bad-soft: rgba(240, 82, 79, 0.14);
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
            color-scheme: dark;
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #eef1f6;
                --surface: #ffffff;
                --raised: #ffffff;
                --raised-down: #e3e8f0;
                --border: #dce1ea;
                --fg: #1b2130;
                --muted: #687286;
                --accent-soft: rgba(79, 143, 247, 0.12);
                --bad-soft: rgba(240, 82, 79, 0.1);
                --shadow: 0 1px 2px rgba(20, 30, 50, 0.08);
                color-scheme: light;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", "Noto Sans", sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100dvh;
            padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
                     max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
            overflow: hidden;
        }
        button {
            border: none; cursor: pointer; touch-action: manipulation; font: inherit; color: inherit;
            background: none; user-select: none; -webkit-user-select: none;
        }
        svg.i {
            width: 20px; height: 20px; flex-shrink: 0;
            fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        [dir="rtl"] .flip-rtl { transform: scaleX(-1); }

        /* ---- Top bar: status | mode | language | new ---- */
        .top-bar { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .status {
            display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 10px;
            border-radius: 19px; background: var(--raised); border: 1px solid var(--border);
            font-size: 12.5px; font-weight: 500; white-space: nowrap; box-shadow: var(--shadow);
        }
        /* Connected: just the green dot; the text is for when something is wrong */
        .status.online { width: 38px; padding: 0; justify-content: center; }
        .status.online #status-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .status-dot.connected { background: var(--ok); box-shadow: 0 0 0 3px rgba(52, 199, 123, 0.2); }
        .status-dot.disconnected { background: var(--bad); animation: pulse 1.4s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: 0.35; } }

        .segmented {
            flex: 1; min-width: 0; display: flex; padding: 3px; gap: 3px; height: 38px;
            background: var(--raised); border: 1px solid var(--border); border-radius: 12px;
            box-shadow: var(--shadow);
        }
        .segmented button {
            flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 5px;
            border-radius: 9px; font-size: 13.5px; font-weight: 600; color: var(--muted);
            transition: background-color 0.15s, color 0.15s;
        }
        .segmented button svg.i { width: 16px; height: 16px; }
        .segmented button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .segmented button.active { background: var(--accent); color: var(--on-accent); }
        /* Offline the status needs its text: make room by dropping the mode icons */
        .status:not(.online) ~ .segmented svg.i { display: none; }

        .icon-btn {
            position: relative; display: flex; align-items: center; justify-content: center; gap: 3px;
            min-width: 38px; height: 38px; padding: 0 8px; flex-shrink: 0; border-radius: 12px;
            background: var(--raised); border: 1px solid var(--border); box-shadow: var(--shadow);
            font-size: 12px; font-weight: 700;
        }
        .icon-btn svg.i { width: 18px; height: 18px; }
        .icon-btn[hidden], .tool.off { display: none; }
        .icon-btn:active { background: var(--raised-down); }
        /* Native picker over the language button: the phone's own list */
        .icon-btn select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; }

        .notice {
            flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 10px 12px;
            border-radius: 12px; font-size: 13.5px; background: var(--bad-soft); color: var(--bad);
            border: 1px solid var(--bad);
        }
        .notice[hidden] { display: none; }

        /* ---- Tool bar: keys, clipboard, screenshots ---- */
        .tools {
            display: flex; gap: 5px; flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .tools::-webkit-scrollbar { display: none; }
        .tool {
            position: relative; flex: 1 0 42px; min-width: 0; height: 56px; padding: 0 2px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            background: var(--raised); border: 1px solid var(--border); border-radius: 14px;
            box-shadow: var(--shadow); transition: transform 0.08s, background-color 0.15s;
        }
        .tool:active { transform: scale(0.94); background: var(--raised-down); }
        .tool .label {
            max-width: 100%; font-size: 10.5px; line-height: 1.35; color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .tool.erase { color: var(--bad); }
        .tool.shot { color: var(--accent); }
        .tool.gap { margin-inline-start: 3px; }
        .keycap {
            display: flex; align-items: center; height: 20px; padding: 0 4px; border: 1.8px solid currentColor;
            border-radius: 5px; font-size: 10px; font-weight: 800; letter-spacing: 0.02em;
        }
        .tool .badge {
            position: absolute; top: 4px; right: 5px; min-width: 15px; height: 15px; padding: 0 3px;
            border-radius: 8px; background: var(--accent); color: var(--on-accent);
            font-size: 10px; font-weight: 700; line-height: 15px; text-align: center;
        }
        .tool.done { animation: done 0.7s ease-out; }
        @keyframes done {
            0% { background: var(--ok); color: #fff; }
            100% { background: var(--raised); }
        }

        /* ---- Composer: text box, and in Send mode its send row ---- */
        .composer {
            flex: 1; min-height: 0; display: flex; flex-direction: column;
            background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
            box-shadow: var(--shadow); overflow: hidden; transition: border-color 0.15s, box-shadow 0.15s;
        }
        .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        textarea {
            flex: 1; min-height: 0; width: 100%; padding: 14px 16px;
            font: inherit; font-size: 18px; line-height: 1.6;
            background: transparent; color: var(--fg); border: none; outline: none; resize: none;
            text-align: start;
        }
        textarea::placeholder { color: var(--muted); opacity: 0.8; }
        .send-row {
            display: flex; align-items: center; gap: 10px; flex-shrink: 0;
            padding: 8px 8px 8px 12px; border-top: 1px solid var(--border);
        }
        [dir="rtl"] .send-row { padding: 8px 12px 8px 8px; }
        .send-row[hidden] { display: none; }

        .switch { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
        .switch input { position: absolute; opacity: 0; pointer-events: none; }
        .switch .track {
            position: relative; width: 36px; height: 22px; flex-shrink: 0; border-radius: 11px;
            background: var(--raised-down); border: 1px solid var(--border); transition: background-color 0.15s;
        }
        .switch .track::after {
            content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 16px; height: 16px;
            border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            transition: inset-inline-start 0.15s;
        }
        .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
        .switch input:checked + .track::after { inset-inline-start: 16px; }
        .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

        .send-btn {
            display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; flex-shrink: 0;
            border-radius: 21px; font-size: 15px; font-weight: 600; color: var(--on-accent);
            background: linear-gradient(180deg, var(--accent), var(--accent-down));
            box-shadow: 0 2px 8px rgba(47, 109, 224, 0.35); transition: transform 0.08s;
        }
        .send-btn:active { transform: scale(0.96); }
        .send-btn svg.i { width: 18px; height: 18px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>

        <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
    </svg>

    <header class="top-bar">
        <div class="status" id="status-pill" role="status">
            <span class="status-dot disconnected" id="status"></span>
            <span id="status-text"></span>
        </div>
        <div class="segmented" role="group" data-i18n-label="mode">
            <button type="button" data-mode="send" aria-pressed="true" class="active">
                <svg class="i flip-rtl" aria-hidden="true"><use href="#i-send"/></svg><span data-i18n="send"></span>
            </button>
            <button type="button" data-mode="live" aria-pressed="false">
                <svg class="i" aria-hidden="true"><use href="#i-live"/></svg><span data-i18n="live"></span>
            </button>
        </div>
        <label class="icon-btn" data-i18n-title="language">
            <svg class="i" aria-hidden="true"><use href="#i-globe"/></svg>
            <select id="lang" data-i18n-label="language">
                <option value="ar">العربية</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
            </select>
        </label>
        <button type="button" class="icon-btn" id="new-btn" data-i18n-title="new">
            <svg class="i" aria-hidden="true"><use href="#i-new"/></svg>
        </button>
        <!-- Android app only: its settings screen -->
        <button type="button" class="icon-btn" id="settings-btn" data-i18n-title="settings" hidden>
            <svg class="i" aria-hidden="true"><use href="#i-gear"/></svg>
        </button>
    </header>

    <div class="notice" id="notice" role="alert" hidden>
        <svg class="i" aria-hidden="true"><use href="#i-alert"/></svg><span id="notice-text"></span>
    </div>

    <!-- Left to right whatever the language, like the PC's screens -->
    <div class="tools" id="quick-keys" dir="ltr">
        <button type="button" class="tool" data-tool="enter" data-key="enter" data-i18n-title="enterTip">
            <svg class="i" aria-hidden="true"><use href="#i-enter"/></svg><span class="label" data-i18n="enter"></span>
        </button>
        <button type="button" class="tool" data-tool="esc" data-key="escape" data-i18n-title="escTip">
            <span class="keycap" aria-hidden="true">Esc</span><span class="label" data-i18n="esc"></span>
        </button>
        <button type="button" class="tool erase" id="erase" data-tool="erase" data-i18n-title="eraseTip">
            <svg class="i" aria-hidden="true"><use href="#i-erase"/></svg><span class="label" data-i18n="erase"></span>
        </button>
        <button type="button" class="tool gap" data-tool="copy" data-key="ctrl+c" data-i18n-title="copyTip">
            <svg class="i" aria-hidden="true"><use href="#i-copy"/></svg><span class="label" data-i18n="copy"></span>
        </button>
        <button type="button" class="tool" data-tool="paste" data-key="ctrl+v" data-i18n-title="pasteTip">
            <svg class="i" aria-hidden="true"><use href="#i-paste"/></svg><span class="label" data-i18n="paste"></span>
        </button>
        <!-- Screenshot buttons, one per screen, added when the PC says how many -->
    </div>

    <div class="composer">
        <textarea id="text" dir="auto"></textarea>
        <div class="send-row" id="send-row">
            <label class="switch">
                <input type="checkbox" id="autoenter"><span class="track"></span><span data-i18n="autoEnter"></span>
            </label>
            <button type="button" class="send-btn" id="send">
                <span data-i18n="sendBtn"></span><svg class="i flip-rtl" aria-hidden="true"><use href="#i-send"/></svg>
            </button>
        </div>
    </div>

    <script src="nacl-fast.min.js"></script>
    <script>
        // ---- Languages ----
        const I18N = {
            ar: {
                connected: 'متصل', disconnected: 'غير متصل', mode: 'الوضع',
                send: 'إرسال', live: 'مباشر', language: 'اللغة',
                new: 'جديد: يفرغ الخانة دون حذف شيء من الحاسوب',
                settings: 'الإعدادات',
                enter: 'إدخال', enterTip: 'Enter', esc: 'إلغاء', escTip: 'Esc',
                erase: 'مسح', eraseTip: 'امسح من الحاسوب ما كتبه الهاتف',
                copy: 'نسخ', copyTip: 'نسخ (Ctrl+C)', paste: 'لصق', pasteTip: 'لصق (Ctrl+V)',
                shot: 'لقطة', shotTip: 'لقطة الشاشة', screen: 'شاشة', screenTip: 'لقطة الشاشة',
                sendBtn: 'إرسال', autoEnter: 'Enter بعد الإرسال',
                placeholder: 'اكتب هنا أو استخدم الصوت…',
                noCrypto: 'تعذر تحميل مكتبة التشفير — أعد تحميل الصفحة',
                noKey: 'لا يوجد مفتاح تشفير في الرابط — امسح رمز QR',
                badKey: 'مفتاح التشفير غير صحيح — امسح رمز QR من جديد',
                rejected: 'رفض الحاسوب الرسائل — أعد تحميل الصفحة',
                replaced: 'اتصل هاتف آخر — أعد تحميل الصفحة للعودة',
                newQr: 'تم إنشاء رمز QR جديد — امسحه',
                expired: 'انتهت صلاحية هذا الرمز — امسح رمز QR الجديد',
            },
            en: {
                connected: 'Connected', disconnected: 'Offline', mode: 'Mode',
                send: 'Send', live: 'Live', language: 'Language',
                new: 'New: empty the box without deleting anything on the PC',
                settings: 'Settings',
                enter: 'Enter', enterTip: 'Enter', esc: 'Escape', escTip: 'Esc',
                erase: 'Erase', eraseTip: 'Delete on the PC what the phone typed',
                copy: 'Copy', copyTip: 'Copy (Ctrl+C)', paste: 'Paste', pasteTip: 'Paste (Ctrl+V)',
                shot: 'Capture', shotTip: 'Screenshot', screen: 'Screen', screenTip: 'Screenshot of screen',
                sendBtn: 'Send', autoEnter: 'Enter after sending',
                placeholder: 'Type here or use your voice…',
                noCrypto: 'Could not load the encryption library — reload the page',
                noKey: 'No encryption key in the link — scan the QR code',
                badKey: 'Wrong encryption key — scan the QR code again',
                rejected: 'The PC rejected the messages — reload the page',
                replaced: 'Another phone connected — reload the page to take over',
                newQr: 'A new QR code was created — scan it',
                expired: 'This QR code has expired — scan the new one',
            },
            fr: {
                connected: 'Connecté', disconnected: 'Hors ligne', mode: 'Mode',
                send: 'Envoyer', live: 'Direct', language: 'Langue',
                new: 'Nouveau : vider la zone sans rien effacer sur le PC',
                settings: 'Paramètres',
                enter: 'Entrée', enterTip: 'Entrée', esc: 'Échap', escTip: 'Échap',
                erase: 'Effacer', eraseTip: 'Effacer sur le PC ce que le téléphone a tapé',
                copy: 'Copier', copyTip: 'Copier (Ctrl+C)', paste: 'Coller', pasteTip: 'Coller (Ctrl+V)',
                shot: 'Capture', shotTip: "Capture d'écran", screen: 'Écran', screenTip: "Capture de l'écran",
                sendBtn: 'Envoyer', autoEnter: 'Entrée après envoi',
                placeholder: 'Écrivez ici ou utilisez la voix…',
                noCrypto: 'Impossible de charger la bibliothèque de chiffrement — rechargez la page',
                noKey: 'Pas de clé de chiffrement dans le lien — scannez le code QR',
                badKey: 'Clé de chiffrement incorrecte — scannez à nouveau le code QR',
                rejected: 'Le PC a refusé les messages — rechargez la page',
                replaced: "Un autre téléphone s'est connecté — rechargez la page pour reprendre",
                newQr: 'Un nouveau code QR a été créé — scannez-le',
                expired: 'Ce code QR a expiré — scannez le nouveau',
            },
        };

        function load(name) {
            try { return localStorage.getItem(name); } catch (e) { return null; }
        }

        function store(name, value) {
            try { localStorage.setItem(name, value); } catch (e) { /* private mode */ }
        }

        // Saved choice, else the phone's language, else Arabic
        function pickLang() {
            const saved = load('lang');
            if (I18N[saved]) return saved;
            for (const tag of navigator.languages || [navigator.language || '']) {
                const code = tag.slice(0, 2).toLowerCase();
                if (I18N[code]) return code;
            }
            return 'ar';
        }

        let lang = pickLang();
        const t = (name) => I18N[lang][name];

        const textarea = document.getElementById('text');
        const modeButtons = document.querySelectorAll('.segmented button');
        const newBtn = document.getElementById('new-btn');
        const langSelect = document.getElementById('lang');
        const quickKeys = document.getElementById('quick-keys');
        const eraseBtn = document.getElementById('erase');
        const statusPill = document.getElementById('status-pill');
        const statusDot = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const sendRow = document.getElementById('send-row');
        const sendBtn = document.getElementById('send');
        const autoEnter = document.getElementById('autoenter');
        const notice = document.getElementById('notice');
        const noticeText = document.getElementById('notice-text');
        let ws = null;
        let reconnectDelay = 1000;

        // Mode: 'send' or 'live'
        let mode = load('mode') === 'live' ? 'live' : 'send';
        let mirror = '';  // What the PC currently has from this box (live mode only)
        let sent = '';    // Send mode: what was sent since the last key, for مسح
        let seq = 0;  // Sequence counter for live mode
        let composing = false;
        let debounceTimer = null;
        let lastLiveSend = 0;  // time of the last live diff (throttle)
        let isConnected = false;
        let screenCount = 0;
        let noticeKey = null;  // message shown in the notice, re-translated on a language change

        function applyLang() {
            const html = document.documentElement;
            html.lang = lang;
            html.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                el.title = t(el.dataset.i18nTitle);
                el.setAttribute('aria-label', el.title);
            });
            document.querySelectorAll('[data-i18n-label]').forEach(el => {
                el.setAttribute('aria-label', t(el.dataset.i18nLabel));
            });
            textarea.placeholder = t('placeholder');
            langSelect.value = lang;
            updateStatusText(isConnected);
            showScreens(screenCount);
            if (noticeKey) noticeText.textContent = t(noticeKey);
        }

        langSelect.addEventListener('change', () => {
            lang = langSelect.value;
            store('lang', lang);
            applyLang();
            textarea.focus();
        });

        // Status text update
        function updateStatusText(connected) {
            isConnected = connected;
            statusDot.classList.toggle('connected', connected);
            statusDot.classList.toggle('disconnected', !connected);
            statusText.textContent = t(connected ? 'connected' : 'disconnected');
            statusPill.classList.toggle('online', connected);
            statusPill.title = statusText.textContent;
        }

        function updateMode() {
            modeButtons.forEach(btn => {
                const on = btn.dataset.mode === mode;
                btn.classList.toggle('active', on);
                btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            sendRow.hidden = mode !== 'send';
        }

        modeButtons.forEach(btn => {
            btn.addEventListener('pointerdown', (e) => e.preventDefault());
            btn.addEventListener('click', () => {
                mode = btn.dataset.mode;
                store('mode', mode);
                sent = '';
                updateMode();
                textarea.focus();
            });
        });

        // Brief green flash: the press went out
        function flash(btn) {
            btn.classList.remove('done');
            void btn.offsetWidth;  // restart the animation
            btn.classList.add('done');
            if (navigator.vibrate) navigator.vibrate(15);
        }

        // ---- Encryption: NaCl secretbox, key from the #k= fragment ----
        // Every frame is base64(nonce || secretbox(JSON)). The server first
        // sends a challenge with a session id; we answer with an encrypted
        // hello, and every message carries that sid and an increasing ctr.
        const key = parseKey();
        let ready = false;   // handshake done
        let stopped = false; // don't reconnect
        let sid = null;
        let ctr = 0;

        function parseKey() {
            const m = location.hash.match(/^#k=([A-Za-z0-9_-]+)$/);
            if (!m || typeof nacl === 'undefined') return null;
            try {
                const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
                const k = fromB64(b64 + '='.repeat((4 - b64.length % 4) % 4));
                return k.length === nacl.secretbox.keyLength ? k : null;
            } catch (e) {
                return null;
            }
        }

        function toB64(bytes) {
            let bin = '';
            for (let i = 0; i < bytes.length; i += 0x8000) {
                bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            }
            return btoa(bin);
        }

        function fromB64(text) {
            return Uint8Array.from(atob(text), c => c.charCodeAt(0));
        }

        function seal(obj) {
            const nonce = nacl.randomBytes(nacl.secretbox.nonceLength);
            const box = nacl.secretbox(new TextEncoder().encode(JSON.stringify(obj)), nonce, key);
            const frame = new Uint8Array(nonce.length + box.length);
            frame.set(nonce);
            frame.set(box, nonce.length);
            return toB64(frame);
        }

        function unseal(text) {
            try {
                const raw = fromB64(text);
                const n = nacl.secretbox.nonceLength;
                const plain = nacl.secretbox.open(raw.subarray(n), raw.subarray(0, n), key);
                return plain ? JSON.parse(new TextDecoder().decode(plain)) : null;
            } catch (e) {
                return null;
            }
        }

        function stop(messageKey) {
            stopped = true;
            ready = false;
            updateStatusText(false);
            noticeKey = messageKey;
            noticeText.textContent = t(messageKey);
            notice.hidden = false;
        }

        function connect() {
            if (stopped) return;
            ready = false;
            const token = new URLSearchParams(location.search).get('t');
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const sock = new WebSocket(`${protocol}//${location.host}/ws?t=${token}`);
            ws = sock;

            sock.onmessage = (ev) => {
                const msg = unseal(ev.data);
                if (ready) {
                    if (msg && msg.type === 'screens') showScreens(msg.count);
                    return;
                }
                if (!msg || msg.type !== 'challenge' || typeof msg.sid !== 'string') {
                    stop('badKey');
                    sock.close();
                    return;
                }
                sid = msg.sid;
                ctr = 0;
                ready = true;
                send({ type: 'hello' });
                updateStatusText(true);
                reconnectDelay = 1000;
                // Clear on reconnect
                textarea.value = '';
                mirror = '';
                sent = '';
                seq = 0;
            };

            sock.onclose = (ev) => {
                if (ws !== sock) return;
                ready = false;
                if (ev.code === 4001) return stop('rejected');
                if (ev.code === 4002) return stop('replaced');
                if (ev.code === 4003) return stop('newQr');
                if (stopped) return;
                updateStatusText(false);
                retry();
            };

            sock.onerror = () => {
                updateStatusText(false);
            };
        }

        // A rejected token looks like a network error to WebSocket, so ask
        // for the page once: 403 means this QR is no longer valid.
        async function retry() {
            try {
                const r = await fetch(location.pathname + location.search, { method: 'HEAD', cache: 'no-store' });
                if (r.status === 403) return stop('expired');
                if (r.status === 429) {
                    setTimeout(connect, 60000);
                    return;
                }
            } catch (e) {
                // PC not reachable: keep retrying
            }
            setTimeout(connect, reconnectDelay);
            reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
        }

        function send(data) {
            if (ready && ws && ws.readyState === WebSocket.OPEN) {
                ctr++;
                ws.send(seal(Object.assign({}, data, { sid: sid, ctr: ctr })));
            }
        }

        function flushLive() {
            if (debounceTimer) {
                clearTimeout(debounceTimer);
                debounceTimer = null;
            }
            sendLiveDiff();
        }

        function sendLiveDiff() {
            const current = textarea.value;
            if (current === mirror) return;

            // Compute diff by Unicode code points
            const mirrorChars = Array.from(mirror);
            const currentChars = Array.from(current);

            let p = 0;
            while (p < mirrorChars.length && p < currentChars.length && mirrorChars[p] === currentChars[p]) {
                p++;
            }

            const deleteCount = mirrorChars.length - p;
            const insert = currentChars.slice(p).join('');

            if (deleteCount > 0 || insert.length > 0) {
                seq++;
                lastLiveSend = Date.now();
                send({ type: 'live', seq: seq, delete: deleteCount, insert: insert });
                mirror = current;
            }
        }

        // Keep focus (and the phone keyboard) on the textarea
        sendBtn.addEventListener('pointerdown', (e) => e.preventDefault());
        sendBtn.addEventListener('click', () => {
            const text = textarea.value;
            if (text.length > 0) {
                send({ type: 'text', text: text });
                textarea.value = '';
                sent += text;
                if (autoEnter.checked) {
                    send({ type: 'key', key: 'enter' });
                    sent = '';
                }
            }
            textarea.focus();
        });

        newBtn.addEventListener('pointerdown', (e) => e.preventDefault());
        newBtn.addEventListener('click', () => {
            textarea.value = '';
            mirror = '';
            sent = '';
            textarea.focus();
        });

        // مسح: delete from the PC what this box typed (since the last key,
        // which may have moved the cursor), and empty the box
        eraseBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            textarea.value = '';
            if (mode === 'live') {
                flushLive();  // sends the deletion of the mirror
            } else {
                const count = Array.from(sent).length;
                if (count > 0) send({ type: 'erase', count: count });
                sent = '';
            }
            flash(eraseBtn);
        });

        // Composition tracking
        textarea.addEventListener('compositionstart', () => {
            composing = true;
        });

        textarea.addEventListener('compositionend', () => {
            composing = false;
            if (mode === 'live') {
                flushLive();
            }
        });

        // Throttled input for live mode: the first letter after a pause goes
        // out at once, then at most one update per gap while typing (longer
        // while the keyboard is composing or dictating, to limit rewrites).
        textarea.addEventListener('input', () => {
            if (mode !== 'live' || debounceTimer) return;
            const gap = composing ? 120 : 60;
            const wait = Math.max(0, lastLiveSend + gap - Date.now());
            debounceTimer = setTimeout(() => {
                debounceTimer = null;
                sendLiveDiff();
            }, wait);
        });

        document.querySelectorAll('.tool[data-key]').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                const key = btn.dataset.key;

                if (mode === 'live') {
                    flushLive();
                    send({ type: 'key', key: key });
                    // The text is the PC's now: clear mirror after sending
                    textarea.value = '';
                    mirror = '';
                } else {
                    send({ type: 'key', key: key });
                    sent = '';
                }
                flash(btn);
            });
        });

        // One screenshot button per screen of the PC, left to right
        function showScreens(count) {
            quickKeys.querySelectorAll('[data-screen]').forEach(btn => btn.remove());
            if (!Number.isInteger(count)) return;
            screenCount = Math.min(Math.max(count, 0), 6);
            const many = screenCount > 1;
            for (let i = 0; i < screenCount; i++) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tool shot' + (i === 0 ? ' gap' : '');
                btn.dataset.screen = i;
                btn.dataset.tool = 'shots';
                btn.innerHTML = '<svg class="i" aria-hidden="true"><use href="#i-camera"/></svg><span class="label"></span>';
                btn.querySelector('.label').textContent = many ? t('screen') : t('shot');
                if (many) {
                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    badge.textContent = i + 1;
                    btn.appendChild(badge);
                }
                btn.title = many ? `${t('screenTip')} ${i + 1}` : t('shotTip');
                btn.setAttribute('aria-label', btn.title);
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    if (mode === 'live') flushLive();
                    send({ type: 'screenshot', screen: i });
                    flash(btn);
                });
                quickKeys.appendChild(btn);
            }
            showTools();
        }

        // ---- Android app (window.EskaBoardApp, see android/…/BoardActivity.kt) ----
        // Its settings: the page language and the tool buttons to hide
        const app = window.EskaBoardApp || null;
        let hiddenTools = [];

        function showTools() {
            quickKeys.querySelectorAll('[data-tool]').forEach(btn => {
                btn.classList.toggle('off', hiddenTools.includes(btn.dataset.tool));
            });
        }

        function applyAppSettings() {
            if (!app) return;
            let settings = {};
            try { settings = JSON.parse(app.settings()) || {}; } catch (e) { return; }
            hiddenTools = Array.isArray(settings.hidden) ? settings.hidden : [];
            if (I18N[settings.lang] && settings.lang !== lang) {
                lang = settings.lang;
                applyLang();
            }
            showTools();
        }
        window.eskaboardApplySettings = applyAppSettings;

        // The app's floating button took a screenshot of the phone: send it to
        // the PC's clipboard as one more encrypted message of this session
        // (same sid and counter rules as any other)
        window.eskaboardSendImage = async function () {
            let ok = false;
            try {
                // Just back from the background: give a reconnect a few seconds
                if (!ready && window.eskaboardResume) window.eskaboardResume();
                for (let i = 0; i < 40 && !ready && !stopped; i++) {
                    await new Promise(r => setTimeout(r, 250));
                }
                const data = app.takeImage();  // base64 PNG, handed over once
                if (data && ready && ws && ws.readyState === WebSocket.OPEN) {
                    send({ type: 'image', format: 'png', data: data });
                    ok = true;
                }
            } catch (e) {
                ok = false;
            }
            try { app.imageResult(ok); } catch (e) { /* activity gone */ }
        };

        if (app) {
            const settingsBtn = document.getElementById('settings-btn');
            settingsBtn.hidden = false;
            settingsBtn.addEventListener('click', () => app.openSettings());
        }

        // Adjust layout when keyboard opens/closes
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                document.body.style.height = `${window.visualViewport.height}px`;
            });
        }

        // Initialize
        applyLang();
        applyAppSettings();
        updateMode();
        textarea.focus();
        if (key) {
            connect();
        } else {
            stop(typeof nacl === 'undefined' ? 'noCrypto' : 'noKey');
        }
    </script>
</body>
</html>
